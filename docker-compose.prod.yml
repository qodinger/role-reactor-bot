services:
  caddy:
    image: caddy:2-alpine
    container_name: role-reactor-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - role-reactor-prod
    depends_on:
      - role-reactor-bot

  role-reactor-bot:
    build: .
    container_name: role-reactor-bot
    restart: unless-stopped
    user: "1001:1001"
    volumes:
      - ./data:/usr/src/app/data
      - ./logs:/usr/src/app/logs:rw
    environment:
      - NODE_ENV=production
    # Port is NOT exposed to the host — Caddy reaches it via the internal network
    networks:
      - role-reactor-prod
    # Healthcheck is defined in the Dockerfile

volumes:
  caddy_data:
  caddy_config:

networks:
  role-reactor-prod:
    driver: bridge
