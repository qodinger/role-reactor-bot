# =============================================================================
# DDoS / L7 hardening snippet — http-level directives
#
# INSTALL (VPS):
#   1. Copy this file to: /etc/nginx/snippets/ddos-limits.conf
#   2. Add inside the http{} block of /etc/nginx/nginx.conf:
#        include /etc/nginx/snippets/ddos-limits.conf;
#   3. Test & apply: nginx -t && systemctl reload nginx
#
# Only active alongside nginx.conf (server block) that references these zones.
# =============================================================================

# --- Response behavior -------------------------------------------------------
limit_req_status  429;
limit_conn_status 429;

# --- Rate-limit zones (10m ≈ 160k IPs tracked per zone) ----------------------
# General API: dashboard polling is ~1 req/30s/user — 30r/s per client IP is
# generous headroom; floods die here before Node sees them.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;

# Inbound webhooks (top.gg / crypto / buymeacoffee): low legitimate traffic,
# burst covers provider retry storms.
limit_req_zone $binary_remote_addr zone=webhooks:10m rate=10r/s;

# Health probes (uptime monitors ping ~1/min).
limit_req_zone $binary_remote_addr zone=healthcheck:10m rate=1r/s;

# Concurrent connections per client IP.
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# --- WebSocket upgrade map (used by server block) -----------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Cloudflare real-client-IP restore ---------------------------------------
# When Cloudflare proxies api.rolereactor.xyz, $remote_addr is a CF edge IP;
# without this, every CF user shares one rate-limit bucket AND the origin IP
# stays hidden-but-the-zones-key-is-wrong. Values trusted ONLY from these CIDRs.
# Keep in sync with https://www.cloudflare.com/ips/ (v4)
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/16;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/16;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;

# CF sets this header for genuine visitors; it cannot be spoofed past the proxy.
real_ip_header CF-Connecting-IP;
