# =============================================================================
# Railway Configuration — Role Reactor Bot
# https://docs.railway.app/reference/config-as-code
#
# Railway auto-detects your Dockerfile — this file just fine-tunes behavior.
# Deploy: push to GitHub (auto-deploy) or run `railway up` via CLI
# =============================================================================

[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  # Railway injects PORT automatically — the app reads:
  # process.env.PORT || process.env.API_PORT || "3030"
  healthcheckPath = "/health"
  healthcheckTimeout = 300    # 5 min — gives bot time to connect to Discord
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10

  # AUTO DEPLOY SLASH COMMANDS on every Railway deploy.
  # Uncomment the line below to enable — commands will register automatically
  # before each new version goes live. Useful if you add/rename commands often.
  # Note: this runs inside the Railway container before traffic is switched over.
  # releaseCommand = "NODE_ENV=production node scripts/deploy-commands.js"
