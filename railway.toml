# =============================================================================
# Railway Configuration — Role Reactor Bot
# https://docs.railway.app/reference/config-as-code
#
# Railway auto-detects your Dockerfile — this file just fine-tunes behavior.
# Deploy: push to GitHub (auto-deploy) or run `railway up` via CLI
# =============================================================================

[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  # Railway injects PORT automatically — the app reads:
  # process.env.PORT || process.env.API_PORT || "3030"
  healthcheckPath = "/health"
  healthcheckTimeout = 300    # 5 min — gives bot time to connect to Discord
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10
