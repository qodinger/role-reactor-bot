# =============================================================================
# api.rolereactor.xyz — reverse proxy to bot (127.0.0.1:3030)
#
# REQUIRES the http-level snippet /etc/nginx/snippets/ddos-limits.conf
# (rate-limit zones, $connection_upgrade map, Cloudflare real-IP restore).
# See that file for install steps.
# =============================================================================

server {
    listen 80;
    server_name api.rolereactor.xyz;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.rolereactor.xyz;

    client_max_body_size 25M;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/api.rolereactor.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rolereactor.xyz/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hide nginx version
    server_tokens off;

    # Slowloris / slow-body protection: drop stalling clients fast
    client_header_timeout 10s;
    client_body_timeout   15s;
    send_timeout          10s;
    keepalive_timeout     30s;
    keepalive_requests    100;

    # Cap concurrent connections per client IP (zone in ddos-limits.conf)
    limit_conn conn_per_ip 20;

    # Logging
    access_log /var/log/nginx/rolereactor.access.log;
    error_log /var/log/nginx/rolereactor.error.log;

    # Health check endpoint (monitoring; tight rate limit, no auth)
    location /health {
        limit_req zone=healthcheck burst=5 nodelay;
        proxy_pass http://127.0.0.1:3030/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # Inbound provider webhooks (top.gg / crypto / buymeacoffee)
    location /webhook/ {
        limit_req zone=webhooks burst=20 nodelay;
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy to Node.js (PM2 / Docker)
    location / {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
